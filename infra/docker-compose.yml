version: '3.8'

services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: sentinel_server
    env_file:
      - ../server/.env
    ports:
      - "8000:8000"
    restart: always

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    container_name: sentinel_client
    env_file:
      - ../client/.env
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: always
